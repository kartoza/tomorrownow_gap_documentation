site_name: Tomorrow Now GAP
site_description: "Project technical and user documentation."
site_author: "Kartoza"
docs_dir: ./src
site_dir: ./site
repo_name: "TomorrowNowGAP"
repo_url: "https://github.com/kartoza/tomorrownow_gap_documentation"
edit_uri: "edit/main/docs/src/"

copyright: Kartoza and Contributors

markdown_extensions:
  - attr_list # lets us resize images see https://github.com/mkdocs/mkdocs/issues/1678#issuecomment-455500757
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  #- mdx_truly_sane_lists
  - toc:
      permalink: true
      #slugify: !!python/name:pymdownx.slugs.slugify
  - pymdownx.snippets:
      base_path: .
  - admonition
  - tables
  - pymdownx.details
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

